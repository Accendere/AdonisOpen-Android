import javax.inject.Inject

plugins {
    id "org.jetbrains.kotlin.kapt"
    id 'com.google.devtools.ksp' version '2.3.6'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id "androidx.navigation.safeargs"
}

tasks.register("zipTheme", Zip) {
    println("Zipping theme")
    from("../AdonisOpen-Shared-Themes/")
    include("action_types.xml")
    include("method_types.xml")
    include("device_types.xml")
    include("texts.xml")
    include("theme.xml")
    include("images/**/*")
    include("fonts/**/*")
    archiveFileName.set("linhome.zip")
    destinationDirectory.set(file("src/main/assets/"))
}



// The version is versionName below, the single source of truth (Linhome's git tags are not ours). The short commit hash
// rides along in the APK name and the About screen, so a test build is traceable to its commit. Computed at
// configuration time, unlike the old GitVersionTask, which set project.version after the APK name had been fixed
// ("unspecified").
def gitShortHash = { ->
    try {
        return providers.exec { commandLine "git", "rev-parse", "--short", "HEAD" }.standardOutput.asText.get().trim()
    } catch (ignored) {
        return "nogit"
    }
}()

tasks.named("preBuild").configure {
    dependsOn(tasks.named("zipTheme"))
}

// Release signing is optional and never committed to the repository.
// Provide credentials either via an untracked keystore.properties file at the
// project root (see keystore.properties.example) or via environment variables:
//   ADONIS_KEYSTORE_FILE, ADONIS_KEYSTORE_PASSWORD, ADONIS_KEY_ALIAS, ADONIS_KEY_PASSWORD
// When no keystore is configured, release builds are produced unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFilePath = keystoreProperties['storeFile'] ?: System.getenv("ADONIS_KEYSTORE_FILE")
def hasReleaseSigning = releaseStoreFilePath && rootProject.file(releaseStoreFilePath).exists()

android {
    compileSdk = 36
    defaultConfig {
        applicationId "org.probonis"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 42
        versionName "2.0.1"
        buildConfigField "String", "GIT_HASH", "\"${gitShortHash}\""
        // The Linhome release this fork started from, shown on the About screen.
        buildConfigField "String", "LINHOME_BASE_VERSION", "\"1.5.0\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.all { variant ->
        variant.getMergedFlavor().manifestPlaceholders = [
                linhome_file_provider: applicationId + ".fileprovider"
        ]
        variant.outputs.all {
            outputFileName = "adonis-open-${variant.buildType.name}-${variant.versionName}-${gitShortHash}.apk"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword keystoreProperties['storePassword'] ?: System.getenv("ADONIS_KEYSTORE_PASSWORD")
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv("ADONIS_KEY_ALIAS")
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv("ADONIS_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    namespace 'org.linhome'
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.5'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.5'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for unit tests (android.jar only has stubs), coroutine virtual time, a local HTTP server.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Pinned to an exact version: a release tag must rebuild exactly the published app (GPLv3 source).
    implementation "org.linphone:linphone-sdk-android:5.4.129"

    // PermissionsDispatcher (not ksp compliant)
    implementation 'com.github.permissions-dispatcher:permissionsdispatcher:4.9.2'
    kapt 'com.github.permissions-dispatcher:permissionsdispatcher-processor:4.9.2'

    // Glide (not ksp compliant)
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    kapt 'com.github.bumptech.glide:compiler:5.0.5'

    implementation 'commons-codec:commons-codec:1.19.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation 'com.caverock:androidsvg-aar:1.4'

    // Push: the SIP server (sip.linhome.org) wakes the app with FCM when a door calls. Messaging only:
    // no Analytics, no Crashlytics.
    implementation 'com.google.firebase:firebase-messaging:25.0.1'

    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation "androidx.media:media:1.7.1"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-beta01'
}
