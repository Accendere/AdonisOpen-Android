// a custom task type with ExecOperations injected
abstract class GitVersionTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void run() {
        def gitVersion = "5.0.0"
        def gitVersionStream = new ByteArrayOutputStream()
        def gitCommitsCount = new ByteArrayOutputStream()
        def gitCommitHash = new ByteArrayOutputStream()

        try {
            getExecOperations().exec {
                commandLine "git", "describe", "--abbrev=0"
                standardOutput = gitVersionStream
            }
            getExecOperations().exec {
                commandLine "git", "rev-list",
                        gitVersionStream.toString().trim() + "..HEAD", "--count"
                standardOutput = gitCommitsCount
            }
            getExecOperations().exec {
                commandLine "git", "rev-parse", "--short", "HEAD"
                standardOutput = gitCommitHash
            }

            if (gitCommitsCount.toString().toInteger() == 0) {
                gitVersion = gitVersionStream.toString().trim()
            } else {
                gitVersion = gitVersionStream.toString().trim() + "." +
                        gitCommitsCount.toString().trim() + "+" +
                        gitCommitHash.toString().trim()
            }
            println("Git version: " + gitVersion)
        } catch (ignored) {
            println("Git not found")
        }
        project.version = gitVersion
    }
}

tasks.register("getGitVersion", GitVersionTask)
tasks.named("preBuild").configure {
    dependsOn(tasks.named("getGitVersion"))
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("zipTheme"))
    dependsOn(tasks.named("getGitVersion"))
}

// Release signing is optional and never committed to the repository.
// Provide credentials either via an untracked keystore.properties file at the
// project root (see keystore.properties.example) or via environment variables:
//   ADONIS_KEYSTORE_FILE, ADONIS_KEYSTORE_PASSWORD, ADONIS_KEY_ALIAS, ADONIS_KEY_PASSWORD
// When no keystore is configured, release builds are produced unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFilePath = keystoreProperties['storeFile'] ?: System.getenv("ADONIS_KEYSTORE_FILE")
def hasReleaseSigning = releaseStoreFilePath && rootProject.file(releaseStoreFilePath).exists()

android {
    compileSdk = 36
    defaultConfig {
        applicationId "org.probonis"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 40
        versionName "1.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.all { variant ->
        variant.getMergedFlavor().manifestPlaceholders = [
                linhome_file_provider: applicationId + ".fileprovider"
        ]
        variant.outputs.all {
            outputFileName = "adonis-open-${variant.buildType.name}-${project.version}.apk"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword keystoreProperties['storePassword'] ?: System.getenv("ADONIS_KEYSTORE_PASSWORD")
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv("ADONIS_KEY_ALIAS")
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv("ADONIS_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    namespace 'org.linhome'
}

